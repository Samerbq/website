<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio - samer</title>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/photos.css">

    <!-- link preview -->
    <meta name="description"        content="photos by samer.">
    <meta property="og:title"       content="by samer">
    <meta property="og:description" content="photos by samer.">
    <meta property="og:image"       content="https://samerbq.github.io/website/photos/img/preview.jpg">
    <meta property="og:url"         content="https://samerbq.github.io/website/photos/portfolio.html">
    <meta property="og:type"        content="website">
    <meta name="twitter:card"       content="summary">

</head>
<body>

    <!-- 2026-27 -->
    <section class="season">

        <div class="cover">
            <div class="photo natural cover-photo"><img src="img/2026-27/cover.jpg" alt="photo" fetchpriority="high"></div>
            <h2>2026-27</h2>
            <a href="./" class="cover-back"><- back to main</a>
        </div>

        <div class="row named">
            <figure>
                <div class="photo"><img src="img/2026-27/1.jpg" alt="photo"></div>
                <figcaption>greece</figcaption>
            </figure>

            <figure>
                <div class="photo"><img src="img/2026-27/2.jpg" alt="photo"></div>
                <figcaption>macedonia</figcaption>
            </figure>

            <figure>
                <div class="photo"><img src="img/2026-27/3.jpg" alt="photo"></div>
                <figcaption>greece</figcaption>
            </figure>

            <figure>
                <div class="photo"><img src="img/2026-27/4.jpg" alt="photo"></div>
                <figcaption>greece</figcaption>
            </figure>
        </div>

    </section>

    <!-- 2025-26 -->
    <section class="season">

        <div class="cover">
            <div class="photo natural cover-photo"><img src="img/2025-26/cover.jpg" alt="photo"></div>
            <h2>2025-26</h2>
        </div>

        <!-- data-count = how many photos are in that folder ( named 01.jpg , 02.jpg , ... ) -->

        <!-- big photo + thumbnails on the left -->
        <div class="gallery" data-folder="img/2025-26/gallery/"  data-count="12"></div>

        <!-- slider -->
        <div class="slider"  data-folder="img/2025-26/slider/"   data-count="10"></div>

        <!-- mini photos -->
        <div class="grid"    data-folder="img/2025-26/grid/"     data-count="14"></div>

        <!-- slider 2 -->
        <div class="slider"  data-folder="img/2025-26/slider-2/" data-count="8" ></div>

    </section>

    <footer>
        <a href="https://www.instagram.com/samerbq" target="_blank" rel="noopener">@samerbq</a>
    </footer>

    <script src="assets/js/photos.js"></script>

</body>
</html>
